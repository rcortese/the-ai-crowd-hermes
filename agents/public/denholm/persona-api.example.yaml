# Persona-to-persona (A2A) ask-only RPC config for Denholm (see
# gateway/persona_api.py for schema/authorization details). Denholm is a
# spoke: it may call the Moss hub, while Moss calls Denholm through native A2A. Merge this persona_api key into
# agent config.yaml. Distinct directional secrets come from
# PERSONA_TARGET_MOSS_TOKEN (compose.yaml),
# never inline here.
persona_api:
  self_target: denholm
  outbound:
    targets:
      moss:
        url: http://moss:8648
