model:
  default: anthropic/claude-opus-4.6
  provider: auto

display:
  personality: terse
  reasoning: off

terminal:
  backend: local
  timeout: 60
  working_dir: /opt/data

context:
  compression:
    enabled: true
    threshold: 0.40
    target_ratio: 0.30
    protect_last: 40

timezone: UTC

# Persona-to-persona (A2A) ask-only RPC. The Elders is a spoke: it only
# talks to the Moss hub. Distinct directional secrets come from
# PERSONA_CALLER_MOSS_TOKEN and PERSONA_TARGET_MOSS_TOKEN (compose.yaml),
# never inline here.
persona_api:
  self_target: the-elders
  inbound:
    callers:
      moss:
        allow_targets: [the-elders]
  outbound:
    targets:
      moss:
        url: http://moss:8648
